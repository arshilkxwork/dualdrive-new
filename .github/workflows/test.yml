name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            keyholder/package-lock.json
      # npm ci at the root also installs keyholder's dependencies (postinstall).
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
